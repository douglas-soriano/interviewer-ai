services:
  db:
    image: postgres:16-alpine
    container_name: interviewer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewer
      POSTGRES_PASSWORD: interviewer
      POSTGRES_DB: interviewer
    ports:
      - "5432:5432"
    volumes:
      - interviewer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewer -d interviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  interviewer-pgdata:
